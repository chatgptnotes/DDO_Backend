services:
  - type: web
    name: ddo-backend-api
    runtime: python
    region: singapore
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate --noinput && python manage.py apply_adamrit_sync_schema
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_ALLOWED_HOSTS
        value: ddo-backend-api.onrender.com,api.aidoccall.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://www.aidoccall.com,https://aidoccall.com,https://www.ddo.center
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADAMRIT_SUPABASE_URL
        sync: false
      - key: ADAMRIT_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.aidoccall.com,https://aidoccall.com,https://www.ddo.center
      # Shared HMAC secret for the signed session tokens issued by the login
      # endpoints — MUST be the exact same value as AUTH_SESSION_SECRET in the
      # AiSurgeonPilot production environment.
      - key: AUTH_SESSION_SECRET
        sync: false

  - type: worker
    name: ddo-adamrit-sync-worker
    runtime: python
    region: singapore
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_adamrit_sync_jobs
    maxShutdownDelaySeconds: 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADAMRIT_SUPABASE_URL
        sync: false
      - key: ADAMRIT_SUPABASE_SERVICE_ROLE_KEY
        sync: false
